name: Rebase YubiKey branch

on:
  push:
    branches:
      - automation/sync-export-20260919
    paths:
      - .github/workflows/rebase-yubikey.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: codex/yubikey-piv
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "GeekMr"
          git config user.email "140129782+WilliamWang1721@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:codex/yubikey-piv
