name: PR 455 isolated split duplication diagnostic

on:
  push:
    branches: [codex/pr455-isolated-diagnostic]
    paths: [.github/workflows/pr455-isolated-diagnostic.yml, .github/diagnostics/pr455-isolated.py]
  workflow_dispatch:
    inputs:
      test_timeout_seconds:
        description: Isolated test deadline in seconds (30 to 600)
        type: string
        default: "120"

permissions:
  contents: read

concurrency:
  group: pr455-isolated-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'WilliamWang1721/pebrel'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.97.1"
      SOURCE_SHA: 653b6f890a558d1b146a20034e149021869cc52a
      TEST_TIMEOUT_SECONDS: ${{ inputs.test_timeout_seconds || '120' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain helper outside the source checkout
        run: cp .github/diagnostics/pr455-isolated.py "$RUNNER_TEMP/pr455-isolated.py"
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: 653b6f890a558d1b146a20034e149021869cc52a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing native dependencies and stack collector
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zsh gdb libasound2-dev libdbus-1-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xkb-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          extra-key: -release-check-v2
          target: |
            target/ci
            target/release
          revision: dependencies-v1
          save-if: "false"
      - name: Instrument fixture, build exact source, and run only the new test
        run: python3 "$RUNNER_TEMP/pr455-isolated.py" "$RUNNER_TEMP/pr455-evidence"
      - name: Upload diagnosis even when the test fails or times out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr455-isolated-653b6f89-${{ github.run_id }}
          path: ${{ runner.temp }}/pr455-evidence
          if-no-files-found: error
          retention-days: 7
