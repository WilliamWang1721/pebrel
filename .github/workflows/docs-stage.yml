name: Stage docs content
on:
  push:
    branches: [automation/docs-source-20260924]
    paths: [.github/workflows/docs-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: delivery
      - uses: actions/checkout@v4
        with:
          ref: 9dc058d12765893553d5fc7a2c37c870c96168b0
          path: project
          fetch-depth: 0
      - name: Stage verified authored content only
        run: |
          python - <<'PY'
          import pathlib, base64, gzip, json, hashlib, subprocess
          encoded = ''.join(p.read_text().strip() for p in sorted(pathlib.Path('delivery/automation/docs-payload').glob('*.txt')))
          assert hashlib.sha256(encoded.encode()).hexdigest() == '321b61ad8f043a5a11a6d1a10bad7774375e8db923444204cc5f77e39d25248e'
          data = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          root = pathlib.Path('project').resolve()
          files = []
          for name, content in data['files'].items():
              if name.startswith('.github/workflows/'):
                  continue
              path = (root / name).resolve()
              assert path.is_relative_to(root)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + '\n', encoding='utf-8')
              files.append(name)
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args], text=True)
          git('config','user.name','WilliamWang1721')
          git('config','user.email','140129782+WilliamWang1721@users.noreply.github.com')
          git('add','--',*files)
          git('diff','--cached','--check')
          git('commit','-m','docs: stage tested user documentation content')
          git('push','origin','HEAD:automation/docs-checkpoint-content-20260924')
          print('TREE=' + git('rev-parse','HEAD^{tree}'))
          PY
