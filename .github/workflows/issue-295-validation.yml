name: Issue 295 validation

on:
  push:
    branches: [automation/issue-295-validation]
    paths: [.github/workflows/issue-295-validation.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: fix/windows-ctrl-slash
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Update the isolated feature branch from upstream
        run: |
          test "$(git rev-parse HEAD)" = c5622dcff163fa7e9f729590caaa372fbdc8568e
          git fetch https://github.com/Kuddev/pebrel.git main
          git rev-parse FETCH_HEAD | tee "$RUNNER_TEMP/upstream-sha.txt"
          git config user.name WilliamWang1721
          git config user.email 140129782+WilliamWang1721@users.noreply.github.com
          git -c commit.gpgsign=false merge --no-edit FETCH_HEAD
      - name: Revalidate scope and repository constraints
        run: |
          base=$(cat "$RUNNER_TEMP/upstream-sha.txt")
          cargo fmt --all -- --check
          git diff --check "$base"
          python3 scripts/check_architecture.py --base "$base"
          python3 scripts/check_platform_cfg.py
          python3 -m unittest scripts.tests.test_platform_cfg scripts.tests.test_architecture_budgets scripts.tests.test_architecture_dependencies scripts.tests.test_prohibited_names -q
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          base = (Path(os.environ['RUNNER_TEMP']) / 'upstream-sha.txt').read_text().strip()
          paths = subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines()
          assert paths == ['nebula_app/src/gpui_shell/terminal/keymap.rs', 'nebula_app/src/gpui_shell/terminal/keymap/win32.rs'], paths
          assert subprocess.check_output(['git', 'diff', 'c5622dcff163fa7e9f729590caaa372fbdc8568e', '--', *paths]) == b''
          PY
      - name: Push the updated feature branch
        id: commit
        run: |
          base=$(cat "$RUNNER_TEMP/upstream-sha.txt")
          git diff --binary "$base" > "$RUNNER_TEMP/issue-295.patch"
          git push origin HEAD:refs/heads/fix/windows-ctrl-slash
          git rev-parse HEAD | tee "$RUNNER_TEMP/candidate-sha.txt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output="$RUNNER_TEMP/pebrel-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-295-candidate
          path: |
            ${{ runner.temp }}/issue-295.patch
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/upstream-sha.txt
            ${{ runner.temp }}/pebrel-source.zip
          retention-days: 7
  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: ./.github/actions/rust-cache
        with:
          key: native
          target: target/ci
          extra-key: '-release-check-v2'
          revision: dependencies-v1
          save-if: 'false'
      - name: Prepare the pinned Windows console runtime
        shell: pwsh
        run: |
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
          ./scripts/tests/windows-runtime.tests.ps1 -Architecture x64
      - name: Run the real GPUI terminal keymap tests
        shell: pwsh
        run: |
          cargo test --config .github/ci-profile.toml --profile ci --locked -p nebula --bin pebrel --features gpui-test-support gpui_shell::terminal::keymap::tests -- --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/keymap-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-295-windows-tests
          path: ${{ runner.temp }}/keymap-tests.log
          if-no-files-found: warn
          retention-days: 7
