name: Issue 295 validation

on:
  push:
    branches: [automation/issue-295-validation]
    paths: [.github/workflows/issue-295-validation.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kuddev/pebrel
          ref: main
          persist-credentials: false
      - name: Archive full upstream source
        shell: bash
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/upstream-sha.txt"
          git archive --format=zip --output="$RUNNER_TEMP/pebrel-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-295-upstream-source
          path: |
            ${{ runner.temp }}/pebrel-source.zip
            ${{ runner.temp }}/upstream-sha.txt
          retention-days: 7
