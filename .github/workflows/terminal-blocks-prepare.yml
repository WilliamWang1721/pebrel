name: Terminal blocks validation
on:
  push:
    branches: [automation/terminal-blocks-prepare]
    paths: [.github/workflows/terminal-blocks-prepare.yml]
permissions:
  contents: read
concurrency:
  group: terminal-blocks-isolated-validation
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Apply reviewed fix to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          PARENT=6f62c957cccce8f42fdbae3e381d5e7025cf1b72
          BASE=ba31b0d9c3225758121588068ba763bbf46ccb71
          git fetch origin refs/heads/feat/experimental-terminal-blocks
          test "$(git rev-parse FETCH_HEAD)" = "$PARENT"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(Path('tmp/terminal-blocks-v2.b64').read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a0ca7016c5e47acb6570acda388f015b681f0587a8fe3c8fdca052987d9f5051'
          Path(os.environ['RUNNER_TEMP'], 'terminal-blocks.patch').write_bytes(patch)
          PY
          git worktree add -b feat/experimental-terminal-blocks "$RUNNER_TEMP/terminal-blocks-worktree" "$PARENT"
          cd "$RUNNER_TEMP/terminal-blocks-worktree"
          git apply --check "$RUNNER_TEMP/terminal-blocks.patch"
          git apply --index "$RUNNER_TEMP/terminal-blocks.patch"
          test "$(git write-tree)" = ad432728df0b6a0d29f5608d84f0d500a3880d99
          git diff --cached --check
          cargo fmt --all -- --check
          python3 scripts/check_architecture.py --base "$BASE"
          git -c user.name=GeekMr -c user.email=140129782+WilliamWang1721@users.noreply.github.com commit -m 'fix(terminal): preserve live block input after moving the cursor'
          git push origin HEAD:refs/heads/feat/experimental-terminal-blocks
          git bundle create "$RUNNER_TEMP/terminal-blocks-feature.bundle" "$BASE..HEAD"
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-blocks-feature-commit
          path: ${{ runner.temp }}/terminal-blocks-feature.bundle
          retention-days: 1
