name: Validate repaired Pebrel PRs

on:
  push:
    branches:
      - automation/sync-export-20260919
    paths:
      - .github/workflows/validate-repaired-prs.yml

permissions:
  contents: read
  actions: read

jobs:
  native-tests:
    name: PR ${{ matrix.pr }} / Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pr: "128", branch: "codex/macos-portable-startup", os: "ubuntu-24.04" }
          - { pr: "128", branch: "codex/macos-portable-startup", os: "windows-2022" }
          - { pr: "128", branch: "codex/macos-portable-startup", os: "windows-11-arm" }
          - { pr: "128", branch: "codex/macos-portable-startup", os: "macos-26" }
          - { pr: "128", branch: "codex/macos-portable-startup", os: "macos-26-intel" }
          - { pr: "129", branch: "codex/network-test-details", os: "ubuntu-24.04" }
          - { pr: "129", branch: "codex/network-test-details", os: "windows-2022" }
          - { pr: "129", branch: "codex/network-test-details", os: "windows-11-arm" }
          - { pr: "129", branch: "codex/network-test-details", os: "macos-26" }
          - { pr: "129", branch: "codex/network-test-details", os: "macos-26-intel" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "ubuntu-24.04" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "windows-2022" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "windows-11-arm" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "macos-26" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "macos-26-intel" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zsh libasound2-dev libdbus-1-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxi-dev
      - name: Require the AppKit SDK used by this PR
        if: runner.os == 'macOS'
        run: |
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Require a native Windows ARM64 compiler
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'The Windows ARM job requires an ARM64 host.'
          }
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $compiler -notcontains 'host: aarch64-pc-windows-msvc') {
            throw 'The Windows ARM job must compile and run ARM64 tests.'
          }
      - uses: ./.github/actions/rust-cache
        id: rust-cache
        with:
          key: native-pr-${{ matrix.pr }}
          extra-key: ${{ runner.os != 'macOS' && '-release-check-v2' || '' }}
          target: |
            target/ci
            ${{ runner.os != 'macOS' && 'target/release' || '' }}
          legacy-key: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}
      - name: Prepare pinned Windows console runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = if ('${{ runner.arch }}' -eq 'ARM64') { 'arm64' } else { 'x64' }
          ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture $architecture
          ./scripts/tests/windows-runtime.tests.ps1 -Architecture $architecture
      - name: Test complete workspace and native harness
        run: python scripts/ci_native_tests.py
      - name: Check source architecture
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python scripts/check_architecture.py
      - name: Test translation and allocation contracts
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked --manifest-path tools/i18n-contract/Cargo.toml
      - name: Check the release workspace
        if: ${{ !cancelled() && runner.os != 'macOS' }}
        run: cargo check --locked --workspace --release

  macos-release-check:
    name: PR ${{ matrix.pr }} / Release workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pr: "128", branch: "codex/macos-portable-startup", os: "macos-26" }
          - { pr: "128", branch: "codex/macos-portable-startup", os: "macos-26-intel" }
          - { pr: "129", branch: "codex/network-test-details", os: "macos-26" }
          - { pr: "129", branch: "codex/network-test-details", os: "macos-26-intel" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "macos-26" }
          - { pr: "140", branch: "codex/render-settings-cache", os: "macos-26-intel" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUST_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require the AppKit SDK used by this PR
        run: |
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: ./.github/actions/rust-cache
        id: rust-cache
        with:
          key: native-release-pr-${{ matrix.pr }}
          target: target/release
          legacy-key: macos
      - name: Check the release workspace
        run: cargo check --locked --workspace --release --timings
