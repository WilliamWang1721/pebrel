name: Prepare YubiKey PIV change

on:
  push:
    branches: [codex/piv-transport]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: codex/yubikey-piv
          fetch-depth: 0
          path: source
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Apply and format reviewed source
        working-directory: source
        run: |
          git switch --detach 75dc0b9481c66a88964b2ae6747f98493a415d41
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          changes = json.loads(Path('../transport/tmp/piv-changes.json').read_text())
          for name, change in changes.items():
              path = Path(name)
              if 'content' in change:
                  path.write_text(change['content'])
              else:
                  lines = path.read_text().splitlines(True)
                  for start, end, value in reversed(change['edits']):
                      lines[start:end] = value.splitlines(True)
                  path.write_text(''.join(lines))
          subprocess.run(['git', 'add', '--', *changes], check=True)
          PY
          test "$(git write-tree)" = 8101c87991d7b1ea5190b410f02fe1cb6e068a24
          cargo fmt --all
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          changes = json.loads(Path('../transport/tmp/piv-changes.json').read_text())
          touched = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          assert set(touched) == set(changes), touched
          subprocess.run(['git', 'add', '--', *changes], check=True)
          PY
          git diff --cached --check
          cargo fmt --all -- --check
      - name: Verify contracts
        working-directory: source
        run: |
          python3 scripts/check_architecture.py --base 75dc0b9481c66a88964b2ae6747f98493a415d41
          cargo test --locked --manifest-path tools/i18n-contract/Cargo.toml
      - name: Commit source and export verification bundle
        working-directory: source
        env:
          GIT_AUTHOR_NAME: GeekMr
          GIT_AUTHOR_EMAIL: 140129782+WilliamWang1721@users.noreply.github.com
          GIT_COMMITTER_NAME: GeekMr
          GIT_COMMITTER_EMAIL: 140129782+WilliamWang1721@users.noreply.github.com
        run: |
          git commit -m 'feat: load existing YubiKey PIV keys for explicit SSH authentication'
          git push origin HEAD:refs/heads/codex/yubikey-piv
          git branch piv-result HEAD
          git bundle create "$RUNNER_TEMP/piv.bundle" piv-result ^75dc0b9481c66a88964b2ae6747f98493a415d41
          git diff 75dc0b9481c66a88964b2ae6747f98493a415d41 HEAD > "$RUNNER_TEMP/yubikey-piv.patch"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: piv-source
          path: |
            ${{ runner.temp }}/piv.bundle
            ${{ runner.temp }}/yubikey-piv.patch
          if-no-files-found: error
          retention-days: 1
