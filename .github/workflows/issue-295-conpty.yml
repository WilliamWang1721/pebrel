name: Issue 295 ConPTY comparison
on:
  push:
    branches: [automation/issue-295-validation]
    paths: [.github/workflows/issue-295-conpty.yml]
permissions:
  contents: read
jobs:
  conpty:
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5622dcff163fa7e9f729590caaa372fbdc8568e
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Pebrel's pinned console host
        run: ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost -Architecture x64
      - name: Verify the native key and legacy byte consumers
        shell: pwsh
        run: |
          git rev-parse HEAD
          python -m py_compile control/tmp/issue-295-conpty.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python control/tmp/issue-295-conpty.py assets/windows/conhost/conpty.dll probe-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-295-conpty-results
          path: probe-results
          if-no-files-found: warn
          retention-days: 7
