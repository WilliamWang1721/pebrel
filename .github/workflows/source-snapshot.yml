name: Source snapshot

on:
  push:
    branches:
      - automation/source-snapshot-20260921

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kuddev/pebrel
          ref: 3050374343f0b3b1821c38ffaedb3a75201b6355
          fetch-depth: 1
      - uses: actions/upload-artifact@v4
        with:
          name: pebrel-main-3050374
          path: .
          include-hidden-files: true
          retention-days: 1
