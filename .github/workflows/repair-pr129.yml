name: Repair PR 129 against main

on:
  push:
    branches:
      - automation/sync-export-20260919
    paths:
      - .github/workflows/repair-pr129.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: codex/network-test-details
          fetch-depth: 0

      - name: Merge current main and resolve CI-only conflict
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = ".github/workflows/linux-lua.yml"
            git checkout --theirs .github/workflows/linux-lua.yml
            git add .github/workflows/linux-lua.yml
          fi
          git restore --source=origin/main --staged --worktree .github/workflows/preview-packages.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          python3 scripts/check_architecture.py --base "$(git rev-parse origin/main)"
          python3 -m json.tool nebula_app/i18n/en-US.json >/dev/null
          python3 -m json.tool nebula_app/i18n/zh-CN.json >/dev/null
          python3 -m json.tool nebula_app/i18n/zh-TW.json >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Validate focused change
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p nebula --bin pebrel --features gpui-test-support proxy_test
          cargo test --locked -p nebula-settings

      - name: Commit and push resolved merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "merge: sync network test PR with current main"
          git push origin HEAD:codex/network-test-details
