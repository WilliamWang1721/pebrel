name: Validate Windows system notifications

on:
  push:
    branches:
      - ci/windows-system-notifications-validation

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
