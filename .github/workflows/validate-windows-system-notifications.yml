name: Validate Windows system notifications

on:
  push:
    branches:
      - ci/windows-system-notifications-validation

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Workflow probe
        shell: pwsh
        run: Write-Host "windows-validation-workflow-loaded"
