name: Prepare desktop UI comfort branch
on:
  push:
    branches: [automation/desktop-ui-comfort-20260924]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply isolated UI changes to upstream baseline
        shell: bash
        run: |
          set -euo pipefail
          cp tmp/desktop-ui-comfort-apply.py "$RUNNER_TEMP/desktop-ui-comfort-apply.py"
          cp tmp/desktop-ui-comfort-tests.rs "$RUNNER_TEMP/desktop-ui-comfort-tests.rs"
          git checkout -b fix/desktop-ui-control-spacing 9dc058d12765893553d5fc7a2c37c870c96168b0
          python3 "$RUNNER_TEMP/desktop-ui-comfort-apply.py" "$RUNNER_TEMP/desktop-ui-comfort-tests.rs"
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          python3 scripts/check_architecture.py --base 9dc058d12765893553d5fc7a2c37c870c96168b0
          git add nebula_app/src/gpui_shell/widgets.rs nebula_app/src/gpui_shell/widgets_tests.rs nebula_app/src/gpui_shell/settings_pane.rs nebula_app/src/gpui_shell/settings_pane/segmented.rs nebula_app/src/gpui_shell/settings_pane/design.rs nebula_app/src/gpui_shell/workspace/sidebar.rs nebula_app/src/gpui_shell/workspace/top_tabs.rs nebula_app/src/gpui_shell/workspace/details_panel.rs
          git diff --exit-code
          git config user.name WilliamWang1721
          git config user.email 140129782+WilliamWang1721@users.noreply.github.com
          git commit -m "fix(ui): improve desktop control sizing and spacing"
          git push origin HEAD:refs/heads/fix/desktop-ui-control-spacing
          git show --stat --oneline HEAD | tee "$RUNNER_TEMP/desktop-ui-comfort-summary.txt"
          git diff HEAD^ HEAD > "$RUNNER_TEMP/desktop-ui-comfort.patch"
          git archive --format=zip -o "$RUNNER_TEMP/desktop-ui-comfort-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-comfort-source
          path: |
            ${{ runner.temp }}/desktop-ui-comfort-summary.txt
            ${{ runner.temp }}/desktop-ui-comfort.patch
            ${{ runner.temp }}/desktop-ui-comfort-source.zip
          retention-days: 7
