name: Submit desktop UI comfort PR
on:
  push:
    branches: [automation/desktop-ui-comfort-20260924]
    paths:
      - .github/workflows/desktop-ui-comfort-prep.yml
      - tmp/desktop-ui-comfort-pr.md
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Create the upstream PR using the existing PR-control authorization
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_PAT }}
        run: |
          gh pr create --repo Kuddev/pebrel --base main --head WilliamWang1721:fix/desktop-ui-control-spacing --draft --title 'fix(ui): improve desktop control sizing and spacing' --body-file tmp/desktop-ui-comfort-pr.md
