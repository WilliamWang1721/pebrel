name: Sync PRs to latest main

on:
  push:
    branches:
      - automation/sync-export-20260919
    paths:
      - .github/workflows/sync-prs-latest-final.yml

permissions:
  contents: write

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: codex/startup-settings
            pr: "117"
          - branch: codex/macos-portable-startup
            pr: "128"
          - branch: codex/network-test-details
            pr: "129"
          - branch: codex/render-settings-cache
            pr: "140"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git diff --check
          python3 scripts/check_architecture.py --base "$(git rev-parse origin/main)"
          git push origin HEAD:${{ matrix.branch }}
