name: Open PR native acceptance
on:
  push:
    branches: [codex/ready-six-source-20260930]
    paths: [.github/workflows/ready-native-ui.yml, .github/review/qa-macos.py]
permissions:
  contents: read
concurrency:
  group: open-pr-native-acceptance
  cancel-in-progress: true
jobs:
  macos:
    name: Native acceptance PR ${{ matrix.pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 289
            scenario: notification
            sha: ef9fb31e487b6ea4b5b7b5966449942bca161872
    runs-on: macos-26
    timeout-minutes: 100
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: ${{ matrix.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ready-native-interface
          workspaces: candidate -> target
          cache-on-failure: true
      - name: Build the exact PR candidate
        working-directory: candidate
        run: cargo build --locked --config .github/ci-profile.toml --profile ci -p nebula --bin pebrel --features gpui-shell
      - name: Verify native controls and capture evidence
        run: python3 .github/review/qa-macos.py '${{ matrix.scenario }}' "$PWD/candidate/target/ci/pebrel" "$PWD/candidate" "$RUNNER_TEMP/acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-pr-${{ matrix.pr }}-${{ matrix.sha }}
          path: |
            ${{ runner.temp }}/acceptance/acceptance.json
            ${{ runner.temp }}/acceptance/*.png
          retention-days: 7
          if-no-files-found: error
