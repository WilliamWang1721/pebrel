name: Validate macOS self-update patch

on:
  push:
    branches:
      - validation/macos-auto-update-20260921

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Apply exact local patch
        shell: bash
        run: |
          base64 --decode < .github/validation/macos-auto-update.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/update.patch"
          echo "403cbf40fbdb4ed4fd83c1dd5aab78358be5adbfd9a750ed24e3fa2d58db1efe  $RUNNER_TEMP/update.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/update.patch"
          git apply "$RUNNER_TEMP/update.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("nebula_app/src/platform/update_installation.rs")
          s = p.read_text()
          s = s.replace(
              "use std::process::Child;\n",
              "use std::process::Child;\n#[cfg(target_os = \"macos\")]\nuse std::process::Command;\n",
              1,
          )
          s = s.replace(
              "fn verify_macos_bundle(bundle: &Path, version: &str) -> io::Result<()> {\n    use std::process::Command;\n",
              "fn verify_macos_bundle(bundle: &Path, version: &str) -> io::Result<()> {\n",
              1,
          )
          p.write_text(s)
          PY
          cargo fmt -p nebula
          git diff --check
          python3 - <<'PY'
          import hashlib, subprocess
          patch = subprocess.check_output(["git", "diff", "--binary"])
          actual = hashlib.sha256(patch).hexdigest()
          expected = "883f729820d05dc36cc93f9b3fef48496fa9594ec23177e9f7fb140d19e1bf01"
          if actual != expected:
              raise SystemExit(f"patched tree differs from sandbox patch: {actual}")
          PY
      - name: Architecture contracts
        run: |
          python3 scripts/check_platform_cfg.py
          python3 scripts/check_architecture.py

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macos-arm64
          - runner: macos-26-intel
            label: macos-x64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Apply exact local patch
        shell: bash
        run: |
          base64 --decode < .github/validation/macos-auto-update.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/update.patch"
          git apply --check "$RUNNER_TEMP/update.patch"
          git apply "$RUNNER_TEMP/update.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("nebula_app/src/platform/update_installation.rs")
          s = p.read_text()
          s = s.replace(
              "use std::process::Child;\n",
              "use std::process::Child;\n#[cfg(target_os = \"macos\")]\nuse std::process::Command;\n",
              1,
          )
          s = s.replace(
              "fn verify_macos_bundle(bundle: &Path, version: &str) -> io::Result<()> {\n    use std::process::Command;\n",
              "fn verify_macos_bundle(bundle: &Path, version: &str) -> io::Result<()> {\n",
              1,
          )
          p.write_text(s)
          PY
          cargo fmt -p nebula
          git diff --check
          python3 - <<'PY'
          import hashlib, subprocess
          patch = subprocess.check_output(["git", "diff", "--binary"])
          actual = hashlib.sha256(patch).hexdigest()
          expected = "883f729820d05dc36cc93f9b3fef48496fa9594ec23177e9f7fb140d19e1bf01"
          if actual != expected:
              raise SystemExit(f"patched tree differs from sandbox patch: {actual}")
          PY
      - name: Compile Pebrel GPUI
        run: cargo check --locked -p nebula --bin pebrel --features gpui-shell
      - name: Update check tests
        run: cargo test --locked -p nebula --bin pebrel --features gpui-shell update_check::tests
      - name: Update download tests
        run: cargo test --locked -p nebula --bin pebrel --features gpui-shell update_download::tests
