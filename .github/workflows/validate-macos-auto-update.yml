name: Validate macOS self-update patch

on:
  push:
    branches:
      - validation/macos-auto-update-20260921

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact local patch
        shell: bash
        run: |
          base64 -d .github/validation/macos-auto-update.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/update.patch"
          echo "403cbf40fbdb4ed4fd83c1dd5aab78358be5adbfd9a750ed24e3fa2d58db1efe  $RUNNER_TEMP/update.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/update.patch"
          git apply "$RUNNER_TEMP/update.patch"
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Architecture contracts
        run: |
          python3 scripts/check_platform_cfg.py
          python3 scripts/check_architecture.py

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macos-arm64
          - runner: macos-26-intel
            label: macos-x64
          - runner: windows-2022
            label: windows-x64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact local patch
        shell: bash
        run: |
          base64 -d .github/validation/macos-auto-update.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/update.patch"
          git apply --check "$RUNNER_TEMP/update.patch"
          git apply "$RUNNER_TEMP/update.patch"
          git diff --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Format nebula crate
        if: matrix.label == 'macos-arm64'
        run: cargo fmt -p nebula -- --check
      - name: Compile Pebrel GPUI
        run: cargo check --locked -p nebula --bin pebrel --features gpui-shell
      - name: Update check tests
        run: cargo test --locked -p nebula --bin pebrel --features gpui-shell update_check::tests
      - name: Update download tests
        run: cargo test --locked -p nebula --bin pebrel --features gpui-shell update_download::tests
