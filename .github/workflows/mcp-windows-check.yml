name: Validate MCP Windows
on:
  push:
    branches: [chore/mcp-source-snapshot-20260925]
    paths: [.github/workflows/mcp-windows-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
      PYTHONUTF8: 1
    steps:
      - name: Use exact source newlines before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 9dc058d12765893553d5fc7a2c37c870c96168b0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mcp-validation-Linux
          run-id: 36148931615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/validated-mcp
      - name: Restore exact validated candidate
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, os
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-mcp/candidate.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '48d42401f91746a167e3be506e7d4c834bbab2065d16fb3da52d1cd789711663'
          PY
          git apply --index "$RUNNER_TEMP/validated-mcp/candidate.patch"
          git diff --cached --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-gpui-ci
          cache-on-failure: true
      - name: Compile actual application and tests
        run: |
          set -o pipefail
          cargo --config .github/ci-profile.toml check --locked --profile ci -p nebula --bin pebrel --features gpui-shell --tests 2>&1 | tee "$RUNNER_TEMP/mcp-build.log"
      - name: MCP tests
        run: |
          set -o pipefail
          cargo --config .github/ci-profile.toml test --locked --profile ci -p nebula --bin pebrel --features gpui-shell mcp:: 2>&1 | tee "$RUNNER_TEMP/mcp-tests.log"
      - name: Architecture contracts
        run: python3 scripts/check_architecture.py --base 9dc058d12765893553d5fc7a2c37c870c96168b0
      - name: Export diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-results"
          git diff --cached --stat > "$RUNNER_TEMP/mcp-results/stat.txt"
          cp "$RUNNER_TEMP"/mcp-*.log "$RUNNER_TEMP/mcp-results/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-validation-Windows
          path: ${{ runner.temp }}/mcp-results/
          retention-days: 3
