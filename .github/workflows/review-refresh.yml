name: Refresh public review history
on:
  push:
    branches: [codex/ready-six-source-20260930]
    paths: [.github/workflows/review-refresh.yml]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kuddev/pebrel
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle only new public repository objects
        shell: bash
        run: |
          set -euo pipefail
          git branch review-main HEAD
          for number in 128 280 288 289 291 294; do
            git fetch --no-tags https://github.com/Kuddev/pebrel.git "refs/pull/$number/head:refs/heads/review-pr$number"
          done
          git bundle create review-update.bundle refs/heads/review-main refs/heads/review-pr128 refs/heads/review-pr280 refs/heads/review-pr288 refs/heads/review-pr289 refs/heads/review-pr291 refs/heads/review-pr294 ^5ff2f3eea54b9c66e416149e17e823b8d72b1dee
          git for-each-ref --format='%(objectname) %(refname)' refs/heads/review- >review-refs.txt
          ls -lh review-update.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: public-review-update
          path: |
            review-update.bundle
            review-refs.txt
          retention-days: 3
