name: Deliver documentation revision

on:
  push:
    branches: [automation/docs-source-20260924]
    paths: [.github/workflows/docs-revision-deliver.yml]

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: delivery

      - uses: actions/checkout@v4
        with:
          ref: docs/complete-user-guide-20260924
          path: project
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify and apply revision
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess

          parts = pathlib.Path('delivery/automation/docs-revision-payload')
          names = [f'{i:02d}.txt' for i in range(1, 16)] + ['16a.txt', '16b.txt', '17.txt', '18.txt']
          encoded = ''.join((parts / name).read_text().strip() for name in names)
          expected = '31ad733ace4c7de430f9bbd9e699cc3fbbb671f43540305115cb1de7797f420a'
          actual = hashlib.sha256(encoded.encode()).hexdigest()
          assert actual == expected, (actual, expected)

          data = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          root = pathlib.Path('project').resolve()
          head = subprocess.check_output(
              ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True
          ).strip()
          assert head == data['expected_parent'], (head, data['expected_parent'])

          for name, content in data['files'].items():
              path = (root / name).resolve()
              assert path.is_relative_to(root)
              assert name == '.gitignore' or name.startswith('docs/site/')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          pathlib.Path('revision.json').write_text(json.dumps(data), encoding='utf-8')
          print(f"Applied {len(data['files'])} files")
          PY

      - name: Validate documentation
        working-directory: project
        run: |
          python -m pip install -r docs/site/requirements.txt
          python -m unittest discover -s docs/site -p 'test_site.py' -v
          python docs/site/build.py

      - name: Commit and push revision
        run: |
          python - <<'PY'
          import json, subprocess

          data = json.load(open('revision.json'))
          def git(*args):
              return subprocess.check_output(['git', '-C', 'project', *args], text=True)

          git('config', 'user.name', 'WilliamWang1721')
          git('config', 'user.email', '140129782+WilliamWang1721@users.noreply.github.com')
          git('add', '--', *data['files'])
          subprocess.run(['git', '-C', 'project', 'diff', '--cached', '--check'], check=True)
          git('commit', '-m', data['message'])
          git('push', 'origin', 'HEAD:docs/complete-user-guide-20260924')
          print('REVISION_SHA=' + git('rev-parse', 'HEAD').strip())
          PY
