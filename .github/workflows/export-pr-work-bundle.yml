name: Export PR work bundle

on:
  push:
    branches:
      - automation/sync-export-20260919
    paths:
      - .github/workflows/export-pr-work-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WilliamWang1721/pebrel
          ref: main
          fetch-depth: 0

      - name: Fetch PR branches and build git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git branch pr128 refs/remotes/origin/codex/macos-portable-startup
          git branch pr129 refs/remotes/origin/codex/network-test-details
          git branch pr140 refs/remotes/origin/codex/render-settings-cache
          git bundle create pebrel-pr-work.gitbundle main pr128 pr129 pr140
          git bundle verify pebrel-pr-work.gitbundle

      - uses: actions/upload-artifact@v4
        with:
          name: pebrel-pr-work-gitbundle
          path: pebrel-pr-work.gitbundle
          if-no-files-found: error
          retention-days: 1
