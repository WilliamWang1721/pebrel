name: Pebrel source snapshot

on:
  push:
    branches:
      - skill-demo/issue-295-source

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream Pebrel
        uses: actions/checkout@v4
        with:
          repository: Kuddev/pebrel
          ref: 83f7246aa377ce16eef9874b28dfbaf78294b8bd
          path: pebrel

      - name: Verify upstream commit
        run: test "$(git -C pebrel rev-parse HEAD)" = "83f7246aa377ce16eef9874b28dfbaf78294b8bd"

      - name: Archive tracked source
        run: git -C pebrel archive --format=zip --output=../pebrel-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pebrel-source-83f7246
          path: pebrel-source.zip
          if-no-files-found: error
