name: Pebrel source snapshot

on:
  push:
    branches:
      - skill-demo/issue-295-source

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream Pebrel
        uses: actions/checkout@v4
        with:
          repository: Kuddev/pebrel
          ref: 83f7246aa377ce16eef9874b28dfbaf78294b8bd
          path: pebrel

      - name: Verify upstream commit
        run: test "$(git -C pebrel rev-parse HEAD)" = "83f7246aa377ce16eef9874b28dfbaf78294b8bd"

      - name: Archive tracked source
        run: git -C pebrel archive --format=zip --output=../pebrel-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pebrel-source-83f7246
          path: pebrel-source.zip
          if-no-files-found: error

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c373422100bce0adcb6ac6a618934e51b096b72b
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Architecture
        run: python3 scripts/check_architecture.py --base acea926f913770a6cadfe6c29af8f13d484f42ba
